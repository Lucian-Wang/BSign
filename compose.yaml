name: bsign
services:
  app:
    build: .
    image: bsign-standard:local
    restart: unless-stopped
    env_file:
      - path: .env.production
        format: raw
    environment:
      BSIGN_DATA: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
